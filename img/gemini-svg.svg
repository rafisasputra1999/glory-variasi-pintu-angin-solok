<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B2E" />
    </linearGradient>

    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="40%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="headlightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Decorative Speed Lines & Shapes -->
  <polygon points="750,0 1200,0 1200,630 580,630" fill="#161E31" opacity="0.6" />
  <polygon points="820,0 850,0 680,630 650,630" fill="url(#accentRed)" opacity="0.15" />
  <polygon points="870,0 880,0 710,630 700,630" fill="url(#accentGold)" opacity="0.2" />

  <!-- Ambient Glow behind car -->
  <ellipse cx="860" cy="390" rx="320" ry="140" fill="url(#glowRed)" />

  <!-- ================= BRANDING & COPYWRITING (LEFT SIDE) ================= -->
  <g transform="translate(80, 90)">
    <!-- Logo Emblem -->
    <g transform="translate(0, 0)">
      <path d="M0,25 L25,0 L65,0 L40,25 L65,50 L25,50 Z" fill="url(#accentRed)" />
      <path d="M35,25 L55,5 L80,5 L60,25 L80,45 L55,45 Z" fill="url(#accentGold)" opacity="0.9" />
      <text x="95" y="24" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" letter-spacing="2">GLORY</text>
      <text x="95" y="46" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="700" font-size="18" fill="#FBBF24" letter-spacing="4">VARIASI</text>
    </g>

    <!-- Badge Tagline -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="265" height="32" rx="16" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1" />
      <circle cx="18" cy="16" r="4" fill="#EF4444" />
      <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#FCA5A5" letter-spacing="1">PUSAT AKSESORIS & MODIFIKASI</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="175" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-0.5">
      TAMPIL BEDA &
    </text>
    <text x="0" y="235" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="52" fill="url(#accentGold)" letter-spacing="-0.5">
      LEBIH BERKELAS
    </text>

    <!-- Subtitle -->
    <text x="0" y="285" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18" fill="#9CA3AF">
      <tspan x="0" dy="0">Upgrade tampilan dan kenyamanan mobil Anda dengan</tspan>
      <tspan x="0" dy="26">pemasangan presisi, bergaransi, dan dikerjakan teknisi ahli.</tspan>
    </text>

    <!-- Service Pills -->
    <g transform="translate(0, 345)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E5E7EB">
      <rect x="0" y="0" width="115" height="34" rx="6" fill="#1F2937" stroke="#374151" />
      <text x="57" y="22" text-anchor="middle">Audio & Android</text>

      <rect x="125" y="0" width="110" height="34" rx="6" fill="#1F2937" stroke="#374151" />
      <text x="180" y="22" text-anchor="middle">Lampu BILED</text>

      <rect x="245" y="0" width="110" height="34" rx="6" fill="#1F2937" stroke="#374151" />
      <text x="300" y="22" text-anchor="middle">Kaca Film</text>

      <rect x="365" y="0" width="115" height="34" rx="6" fill="#1F2937" stroke="#374151" />
      <text x="422" y="22" text-anchor="middle">Bodykit & Jok</text>
    </g>

    <!-- CTA Button Visual -->
    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="220" height="50" rx="8" fill="url(#accentRed)" />
      <text x="110" y="31" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" letter-spacing="0.5">KONSULTASI GRATIS →</text>
    </g>
  </g>

  <!-- ================= ILLUSTRATION: MODERN SPORT SUV/CAR (RIGHT SIDE) ================= -->
  <g transform="translate(560, 175)" filter="url(#shadow)">
    <!-- Ground Shadow -->
    <ellipse cx="320" cy="315" rx="290" ry="18" fill="#000000" opacity="0.85" />

    <!-- Rear Spoiler -->
    <path d="M510,125 L575,112 L582,124 L525,138 Z" fill="#EF4444" />

    <!-- Car Silhouette / Main Body -->
    <path d="M 45,255 
             C 40,225 55,195 95,180 
             L 195,155 
             C 245,110 315,92 415,95 
             C 475,97 520,118 555,150 
             L 585,175 
             C 595,195 595,235 585,265 
             L 530,275 
             C 530,220 450,220 450,275 
             L 210,275 
             C 210,220 130,220 130,275 
             L 60,272 
             C 48,268 45,262 45,255 Z" fill="url(#carBody)" stroke="#4B5563" stroke-width="2" />

    <!-- Racing Accent Stripe on Side -->
    <path d="M 80,222 L 560,192 L 555,204 L 85,232 Z" fill="url(#accentRed)" opacity="0.85" />
    <path d="M 90,236 L 545,208 L 543,212 L 92,240 Z" fill="url(#accentGold)" opacity="0.9" />

    <!-- Windows / Cabin Glass -->
    <path d="M 215,155 
             C 255,118 315,105 405,107 
             C 450,108 490,122 522,148 
             L 365,155 
             L 215,155 Z" fill="url(#glassGrad)" stroke="#6B7280" stroke-width="1.5" />
    
    <!-- Window Pillar -->
    <polygon points="355,106 372,106 365,155 348,155" fill="#111827" />

    <!-- Side Mirror -->
    <path d="M 218,155 L 195,148 L 192,162 L 218,166 Z" fill="#EF4444" />

    <!-- Front Bumper & Air Intake -->
    <path d="M 45,248 L 95,245 L 85,268 L 50,266 Z" fill="#090D16" stroke="#374151" stroke-width="1" />
    <!-- Front Lip Splitter -->
    <path d="M 40,270 L 125,274 L 122,280 L 42,276 Z" fill="#EF4444" />

    <!-- Aggressive LED / BILED Headlight -->
    <path d="M 65,198 L 125,188 L 115,204 L 62,208 Z" fill="#E0F2FE" />
    <!-- Projector Lens Ring -->
    <circle cx="88" cy="199" r="7" fill="#3B82F6" />
    <circle cx="88" cy="199" r="3" fill="#FFFFFF" />
    <!-- Headlight Ambient Glow -->
    <circle cx="85" cy="199" r="35" fill="url(#headlightGlow)" />

    <!-- Taillight LED -->
    <path d="M 555,158 L 588,175 L 582,188 L 548,172 Z" fill="#EF4444" />

    <!-- Door Handle -->
    <rect x="365" y="178" width="24" height="5" rx="2.5" fill="#9CA3AF" />

    <!-- ================= WHEELS & CUSTOM RIMS ================= -->
    <!-- Front Wheel -->
    <g transform="translate(170, 275)">
      <!-- Tire -->
      <circle cx="0" cy="0" r="44" fill="#090D16" stroke="#1F2937" stroke-width="3" />
      <!-- Alloy Rim -->
      <circle cx="0" cy="0" r="30" fill="#111827" stroke="#D1D5DB" stroke-width="2.5" />
      <!-- Brake Caliper (Sport Red) -->
      <path d="M -18,-12 A 22,22 0 0,1 -5,-21 L -3,-12 Z" fill="#EF4444" />
      <!-- Spokes -->
      <g stroke="#9CA3AF" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-28" x2="0" y2="28" />
        <line x1="-28" y1="0" x2="28" y2="0" />
        <line x1="-20" y1="-20" x2="20" y2="20" />
        <line x1="-20" y1="20" x2="20" y2="-20" />
      </g>
      <!-- Center Cap -->
      <circle cx="0" cy="0" r="8" fill="#1F2937" stroke="#FBBF24" stroke-width="2" />
    </g>

    <!-- Rear Wheel -->
    <g transform="translate(490, 275)">
      <!-- Tire -->
      <circle cx="0" cy="0" r="44" fill="#090D16" stroke="#1F2937" stroke-width="3" />
      <!-- Alloy Rim -->
      <circle cx="0" cy="0" r="30" fill="#111827" stroke="#D1D5DB" stroke-width="2.5" />
      <!-- Brake Caliper (Sport Red) -->
      <path d="M -18,-12 A 22,22 0 0,1 -5,-21 L -3,-12 Z" fill="#EF4444" />
      <!-- Spokes -->
      <g stroke="#9CA3AF" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-28" x2="0" y2="28" />
        <line x1="-28" y1="0" x2="28" y2="0" />
        <line x1="-20" y1="-20" x2="20" y2="20" />
        <line x1="-20" y1="20" x2="20" y2="-20" />
      </g>
      <!-- Center Cap -->
      <circle cx="0" cy="0" r="8" fill="#1F2937" stroke="#FBBF24" stroke-width="2" />
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#accentRed)" />
</svg>