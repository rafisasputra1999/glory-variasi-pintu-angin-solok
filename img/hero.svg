<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <!-- Gradien Lantai Bengkel Gelap Reflektif -->
    <linearGradient id="floorBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" stop-opacity="0" />
      <stop offset="22%" stop-color="#111722" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#1A2230" />
      <stop offset="100%" stop-color="#0E131B" />
    </linearGradient>

    <radialGradient id="floorSpotlight" cx="62%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#1E293B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="headlightFloorBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Gradien Bodi Mobil Putih Metallic -->
    <linearGradient id="carWhiteBody" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F1F5F9" />
      <stop offset="78%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="carSideShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="55%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Gradien Roof Box -->
    <linearGradient id="roofBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Gradien Kaca Mobil -->
    <linearGradient id="windowTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gradien Dynamic Shield Chrome & Black -->
    <linearGradient id="chromeTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Efek Cahaya Lampu -->
    <radialGradient id="biledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#BAE6FD" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= BAGIAN LANTAI (FLOOR) ================= -->
  <g id="workshop-floor">
    <!-- Permukaan Lantai Perspektif -->
    <polygon points="0,380 1200,380 1200,650 0,650" fill="url(#floorBase)" />
    <ellipse cx="680" cy="510" rx="580" ry="130" fill="url(#floorSpotlight)" />

    <!-- Pantulan Cahaya Lampu Mobil di Lantai -->
    <ellipse cx="430" cy="545" rx="180" ry="38" fill="url(#headlightFloorBeam)" />
    <ellipse cx="640" cy="565" rx="150" ry="30" fill="url(#headlightFloorBeam)" />

    <!-- Garis Nat / Tekstur Halus Lantai Beton -->
    <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
      <line x1="0" y1="435" x2="1200" y2="435" />
      <line x1="0" y1="505" x2="1200" y2="505" />
      <line x1="0" y1="595" x2="1200" y2="595" />
      <line x1="380" y1="380" x2="120" y2="650" />
      <line x1="650" y1="380" x2="540" y2="650" />
      <line x1="920" y1="380" x2="1080" y2="650" />
    </g>

    <!-- Bayangan Pekat di Bawah Kolong Mobil -->
    <polygon points="485,495 795,555 1115,470 1065,435 520,455" fill="#020408" opacity="0.92" />
    <ellipse cx="790" cy="495" rx="310" ry="42" fill="#000000" opacity="0.75" />
  </g>

  <!-- ================= BAGIAN MOBIL (GLORY VARIASI MPV) ================= -->
  <g id="custom-mpv-car" transform="translate(80, 15)">
    
    <!-- Roof Box & Crossbar -->
    <g id="roof-box">
      <!-- Kaki Crossbar -->
      <rect x="655" y="162" width="12" height="14" rx="2" fill="#0F172A" />
      <rect x="855" y="156" width="12" height="14" rx="2" fill="#0F172A" />
      <path d="M640,165 L895,158 L895,164 L640,171 Z" fill="#334155" />

      <!-- Bodi Utama Roof Box -->
      <path d="M635,148 
               C640,124 685,112 765,110 
               C835,108 892,118 908,136 
               C914,143 910,152 895,155 
               L648,160 
               C635,159 633,154 635,148 Z" fill="url(#roofBoxGrad)" stroke="#475569" stroke-width="1.5" />
      
      <!-- List Aksen Merah & Highlight Roof Box -->
      <path d="M645,147 L902,141 L898,146 L645,152 Z" fill="#EF4444" />
      <path d="M665,126 C720,115 810,114 875,125" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Bodi Utama Mobil (Sisi Samping & Kap Mesin) -->
    <path d="M425,358 
             C425,325 442,302 475,288 
             L548,258 
             C595,205 645,174 715,170 
             L892,166 
             C945,168 985,192 1018,238 
             L1038,278 
             C1048,308 1046,355 1036,385 
             L998,398 
             C998,335 928,335 928,398 
             L778,448 
             C778,370 675,370 675,448 
             L645,488 
             L442,468 
             C428,452 422,415 425,358 Z" fill="url(#carWhiteBody)" stroke="#94A3B8" stroke-width="1.5" />

    <!-- Shading Sisi Samping Mobil -->
    <path d="M765,275 L1035,268 L1036,385 L998,398 C998,335 928,335 928,398 L778,448 C778,370 675,370 675,448 L765,335 Z" fill="url(#carSideShade)" opacity="0.55" />

    <!-- Garis Lekukan Karakter Samping (Body Crease) -->
    <path d="M745,318 L1028,278" fill="none" stroke="#64748B" stroke-width="2" opacity="0.6" />
    <path d="M475,288 C545,295 625,298 695,292" fill="none" stroke="#94A3B8" stroke-width="2" />

    <!-- Kaca Depan (Windshield) & Kaca Samping -->
    <!-- Kaca Depan -->
    <path d="M558,256 
             C600,208 645,182 705,179 
             L782,179 
             L738,266 
             C665,270 598,266 558,256 Z" fill="url(#windowTint)" stroke="#334155" stroke-width="2" />
    <!-- Kilau Kaca Depan -->
    <polygon points="625,188 665,186 618,260 585,258" fill="#FFFFFF" opacity="0.08" />

    <!-- Kaca Samping (Baris 1, 2, 3) -->
    <path d="M798,180 
             L892,178 
             C935,180 968,198 996,232 
             L762,264 
             Z" fill="url(#windowTint)" stroke="#1E293B" stroke-width="2" />
    <!-- Pilar B & Pilar C Hitam -->
    <polygon points="852,179 868,179 862,252 845,254" fill="#090D16" />
    <polygon points="928,184 942,188 946,240 932,242" fill="#090D16" />

    <!-- Spion Samping (Black Carbon Style) -->
    <path d="M755,255 L725,248 C718,248 715,262 722,268 L754,272 Z" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <line x1="723" y1="257" x2="746" y2="260" stroke="#F8FAFC" stroke-width="1.5" />

    <!-- Handle Pintu Chrome -->
    <rect x="822" y="286" width="24" height="6" rx="3" fill="#CBD5E1" stroke="#475569" stroke-width="0.8" />
    <rect x="905" y="276" width="22" height="5" rx="2.5" fill="#CBD5E1" stroke="#475569" stroke-width="0.8" />

    <!-- ================= FASCIA DEPAN (DYNAMIC SHIELD STYLE) ================= -->
    <!-- Grille Tengah Hitam Glossy -->
    <polygon points="462,322 622,332 595,412 452,402" fill="#0F172A" />
    <!-- Bilah Grille Horizontal -->
    <g stroke="#334155" stroke-width="2.5">
      <line x1="460" y1="342" x2="615" y2="352" />
      <line x1="457" y1="360" x2="608" y2="370" />
      <line x1="454" y1="378" x2="602" y2="388" />
    </g>

    <!-- Logo Tiga Berlian (Chrome) -->
    <g transform="translate(515, 344) scale(0.85)" fill="url(#chromeTrim)">
      <polygon points="0,-14 7,-2 0,10 -7,-2" />
      <polygon points="0,10 13,10 19,21 6,21" />
      <polygon points="0,10 -13,10 -19,21 -6,21" />
    </g>

    <!-- Lis Chrome Dynamic Shield Kiri & Kanan -->
    <path d="M448,318 L468,358 L442,425 L432,420 L455,358 L440,322 Z" fill="url(#chromeTrim)" />
    <path d="M645,332 L608,372 L628,448 L642,445 L622,372 L662,334 Z" fill="url(#chromeTrim)" />

    <!-- Air Dam Bawah & Front Lip Splitter -->
    <polygon points="445,425 612,442 602,475 442,458" fill="#090D16" stroke="#334155" stroke-width="1" />
    <!-- Front Lip Bodykit Hitam + Aksen Putih -->
    <path d="M422,462 L648,488 L642,498 L420,470 Z" fill="#0F172A" stroke="#64748B" stroke-width="1" />
    <!-- Side Skirt Sporty -->
    <path d="M775,442 L932,395 L934,408 L776,456 Z" fill="#E2E8F0" stroke="#475569" stroke-width="1" />

    <!-- Pelat Nomor "GLORY VARIASI" -->
    <g transform="translate(480, 384) skewY(5)">
      <rect x="0" y="0" width="76" height="26" rx="3" fill="#090D16" stroke="#475569" stroke-width="1.2" />
      <text x="38" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="9.5" fill="#EF4444" letter-spacing="0.8">GLORY</text>
      <text x="38" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="7.5" fill="#FFFFFF" letter-spacing="1">VARIASI</text>
    </g>

    <!-- ================= LAMPU DRL & HEADLAMP BILED ================= -->
    <!-- DRL Sipit Atas (Kanan & Kiri) -->
    <path d="M442,306 L485,314 L480,320 L440,312 Z" fill="#FFFFFF" filter="url(#glowFilter)" />
    <path d="M622,324 L695,316 L690,324 L620,331 Z" fill="#FFFFFF" filter="url(#glowFilter)" />

    <!-- Rumah Lampu Utama Kanan (Sisi Penumpang - Dekat Kamera) -->
    <polygon points="642,354 696,350 694,394 636,396" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Proyektor BILED Menyala Terang -->
    <circle cx="662" cy="374" r="11" fill="#E0F2FE" />
    <circle cx="682" cy="372" r="10" fill="#E0F2FE" />
    <circle cx="672" cy="374" r="36" fill="url(#biledGlow)" />

    <!-- Rumah Lampu Utama Kiri (Sisi Pengemudi) -->
    <polygon points="432,338 450,342 446,382 428,376" fill="#1E293B" />
    <circle cx="439" cy="360" r="9" fill="#E0F2FE" />
    <circle cx="439" cy="360" r="28" fill="url(#biledGlow)" />

    <!-- Foglamp Bawah -->
    <circle cx="445" cy="436" r="7" fill="#334155" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="445" cy="436" r="3.5" fill="#BAE6FD" />
    <circle cx="605" cy="454" r="8" fill="#334155" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="605" cy="454" r="4" fill="#BAE6FD" />

    <!-- Taillight Merah Belakang -->
    <path d="M1012,232 L1028,236 L1036,265 L1022,262 Z" fill="#DC2626" />

    <!-- ================= RODA & VELG RACING MULTI-SPOKE ================= -->
    <!-- Roda Depan (Perspektif Elips) -->
    <g transform="translate(726, 446)">
      <!-- Ban -->
      <ellipse cx="0" cy="0" rx="46" ry="54" fill="#090D16" stroke="#1E293B" stroke-width="3" />
      <!-- Bibir Velg -->
      <ellipse cx="-2" cy="0" rx="33" ry="40" fill="#111827" stroke="#64748B" stroke-width="2" />
      <!-- Piringan Cakram & Kaliper -->
      <ellipse cx="-2" cy="0" rx="22" ry="27" fill="#1E293B" />
      <path d="M-16,-14 A18,22 0 0,1 -4,-23 L-2,-12 Z" fill="#EF4444" />
      <!-- Jari-jari Velg Racing (Multi-Spoke) -->
      <g stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round">
        <line x1="-2" y1="-38" x2="-2" y2="38" />
        <line x1="-33" y1="0" x2="29" y2="0" />
        <line x1="-24" y1="-27" x2="20" y2="27" />
        <line x1="-24" y1="27" x2="20" y2="-27" />
        <line x1="-13" y1="-35" x2="9" y2="35" />
        <line x1="-13" y1="35" x2="9" y2="-35" />
      </g>
      <!-- Center Cap -->
      <ellipse cx="-2" cy="0" rx="8" ry="10" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.5" />
    </g>

    <!-- Roda Belakang (Perspektif Elips Lebih Kecil) -->
    <g transform="translate(964, 396)">
      <ellipse cx="0" cy="0" rx="35" ry="43" fill="#090D16" stroke="#1E293B" stroke-width="2.5" />
      <ellipse cx="-2" cy="0" rx="25" ry="31" fill="#111827" stroke="#64748B" stroke-width="1.8" />
      <g stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round">
        <line x1="-2" y1="-29" x2="-2" y2="29" />
        <line x1="-25" y1="0" x2="21" y2="0" />
        <line x1="-18" y1="-21" x2="14" y2="21" />
        <line x1="-18" y1="21" x2="14" y2="-21" />
      </g>
      <ellipse cx="-2" cy="0" rx="6" ry="8" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.2" />
    </g>
  </g>
</svg>